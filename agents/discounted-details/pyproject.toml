[project]
name = "dex"
version = "0.1.0"
description = "Dex: customer, booking and CRM agent for Discounted Details"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=2.14,<3",
    "composio>=0.35,<0.36",
    "gspread>=6.1",
    "google-api-python-client>=2.140",
    "google-auth>=2.30",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.4",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "time-machine>=2.15",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: hits real external APIs (not run by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
